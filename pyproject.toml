[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trustrun"
version = "0.1.1"
description = "The trust layer for AI agents"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=7"]
# Keyed eval extras: ToolCallingAgent rounds against live model APIs.
keyed = ["smolagents>=1.0", "numpy>=1.24"]

[project.scripts]
trustrun = "trustrun.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trustrun*"]
