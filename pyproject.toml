[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trustrun"
version = "0.1.1"
description = "The trust layer for AI agents"
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
trustrun = "trustrun.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trustrun*"]
